name: Shell Commands Demo

on:
  workflow_dispatch:

jobs:

  shell-demo:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: List all the file
        run: ls
      
      - name: Display current user
        run: whoami

      - name: Print Message
        run: echo "Hello from GitHub Actions"